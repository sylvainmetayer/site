name: SonarCloud

# Analyse de qualité et de sécurité du code, informative : la Quality Gate
# s'affiche sur les PR sans faire échouer le workflow. La configuration est
# dans sonar-project.properties ; l'Automatic Analysis doit être désactivée
# côté SonarCloud, sinon les deux analyses entrent en conflit.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  sonarcloud:
    runs-on: ubuntu-latest
    # Les PR venant de forks n'ont pas accès au secret
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Historique complet pour attribuer les problèmes (blame) et détecter le nouveau code
          fetch-depth: 0
          persist-credentials: false

      - name: Check for the SonarCloud token
        id: token
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::warning::Secret SONAR_TOKEN absent : analyse SonarCloud ignorée"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: SonarCloud scan
        if: steps.token.outputs.present == 'true'
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
