name: External links

# Liens externes des pages construites, chaque lundi (lychee.toml). Un lien
# cassé ouvre une issue, ou la met à jour si elle est encore ouverte.
on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lychee:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/build

      - name: Check external links
        id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --config lychee.toml --root-dir ${{ github.workspace }}/dist 'dist/**/*.html'
          output: lychee/out.md
          fail: false

      - name: Find the open issue
        if: steps.lychee.outputs.exit_code != 0
        id: issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label liens-casses --json number --jq '.[0].number // empty')
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Open or update the issue
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@fca9117c27cdc29c6c4db3b86c48e4115a786710 # v6.0.0
        with:
          title: Liens externes cassés
          content-filepath: lychee/out.md
          labels: liens-casses
          issue-number: ${{ steps.issue.outputs.number }}

      # Rouge tant que des liens sont cassés : c'est ce statut que montre le badge
      - name: Fail on broken links
        if: steps.lychee.outputs.exit_code != 0
        run: exit 1
