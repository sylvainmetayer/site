# Échoue si .github/workflows/actions.lock ne correspond plus aux workflows
# ou si un commit verrouillé n'existe plus en amont.
# Régénérer à la main : gh actions-lock --no-narrow --ignore-local-actions
# (sans --no-narrow, l'outil réécrit les SHA en tags ; --ignore-local-actions pour ./.github/actions/*).
name: verify-lockfile

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: gh extension install github/gh-actions-lock --pin v0.4.1
      - run: gh actions-lock --verify --ignore-local-actions
