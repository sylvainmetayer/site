name: Daily Build

# Reconstruit le site chaque matin pour publier les articles programmés et
# mettre à jour la date de génération. Le deploy hook Cloudflare Pages
# (secret CLOUDFLARE_PAGES_DEPLOY_HOOK) est posé par homelab, tofu/site.
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Cloudflare Pages deploy hook
        env:
          CLOUDFLARE_PAGES_DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_PAGES_DEPLOY_HOOK }}
        run: |
          if [ -z "$CLOUDFLARE_PAGES_DEPLOY_HOOK" ]; then
            echo "::error::Secret CLOUDFLARE_PAGES_DEPLOY_HOOK absent"
            exit 1
          fi
          curl --fail --silent --show-error -X POST "$CLOUDFLARE_PAGES_DEPLOY_HOOK"
