name: OpenSSF Scorecard

# Bonnes pratiques de sécurité du dépôt (actions épinglées, permissions des
# workflows, protection de branche…). Résultats publiés sur scorecard.dev
# (badge du README) et dans l'onglet Security.
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 2'
  branch_protection_rule:
  workflow_dispatch:

permissions: {}

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      # Envoi des résultats (onglet Security) et publication sur scorecard.dev
      security-events: write
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: results.sarif
