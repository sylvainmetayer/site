name: Syndicate

# Après le déploiement quotidien (daily_build.yml, 6 h UTC) : webmentions
# sortantes et publication des nouveaux articles sur Mastodon et Bluesky
# (scripts/syndicate.mjs). Sans les secrets d'un réseau, il est ignoré.
# Les posts publiés sont notés dans src/_data/syndication.json, commité ici :
# les commentaires des articles en viennent.
on:
  schedule:
    - cron: '30 7 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Afficher sans rien envoyer
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  syndicate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Pushes src/_data/syndication.json at the end
          persist-credentials: true

      - uses: ./.github/actions/setup

      - name: Send webmentions and post new articles
        env:
          MASTODON_INSTANCE: ${{ vars.MASTODON_INSTANCE }}
          MASTODON_TOKEN: ${{ secrets.MASTODON_TOKEN }}
          BLUESKY_HANDLE: ${{ vars.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: node scripts/syndicate.mjs --days 2 $DRY_RUN

      - name: Commit the new posts (src/_data/syndication.json)
        if: ${{ !inputs.dry_run }}
        run: |
          git diff --quiet -- src/_data/syndication.json && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Syndication : nouveaux posts Mastodon/Bluesky" -- src/_data/syndication.json
          git push
