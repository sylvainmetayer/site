name: Syndicate

# Après le déploiement quotidien (daily_build.yml, 6 h UTC) : webmentions
# sortantes et publication des nouveaux articles sur Mastodon et Bluesky
# (scripts/syndicate.mjs). Sans les secrets d'un réseau, il est ignoré.
# Les posts publiés sont notés dans src/_data/syndication.json (les commentaires
# des articles en viennent). main n'accepte que des PR (ruleset, homelab
# tofu/site) : le fichier mis à jour est déposé en artefact et une issue
# demande de le reporter dans une PR.
on:
  schedule:
    - cron: '30 7 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Afficher sans rien envoyer
        type: boolean
        default: true

permissions:
  contents: read
  issues: write

jobs:
  syndicate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Send webmentions and post new articles
        env:
          MASTODON_INSTANCE: ${{ vars.MASTODON_INSTANCE }}
          MASTODON_TOKEN: ${{ secrets.MASTODON_TOKEN }}
          BLUESKY_HANDLE: ${{ vars.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: node scripts/syndicate.mjs --days 2 $DRY_RUN

      - name: Check for new posts
        id: changed
        if: ${{ !inputs.dry_run }}
        run: git diff --quiet -- src/_data/syndication.json || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Keep the updated syndication.json
        if: steps.changed.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: syndication
          path: src/_data/syndication.json

      - name: Ask for a PR with the new posts
        if: steps.changed.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "Nouveaux posts Mastodon/Bluesky : reporter ce changement de \`src/_data/syndication.json\` dans une PR (fichier complet dans l'artefact « syndication » de $RUN_URL)."
            echo
            echo '```diff'
            git diff -- src/_data/syndication.json
            echo '```'
          } > "$RUNNER_TEMP/body.md"
          gh issue create --repo "$GITHUB_REPOSITORY" --title "Syndication : posts à reporter dans syndication.json" --body-file "$RUNNER_TEMP/body.md"
