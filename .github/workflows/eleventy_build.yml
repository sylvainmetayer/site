name: CI

# Un seul build de production, puis les contrôles sur ce même dist/ :
# liens et CV (build), HTML valide (html), accessibilité WCAG 2 AA (accessibility).
on:
  push:
    branches-ignore: [badges]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/build

      - name: Share the build with the other jobs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist
          retention-days: 1

      - name: Check links, redirects and published URLs
        run: npm run check:links

      # The committed CVs (French and English) must read well in applicant tracking
      # systems and match the sources: a content change without « mise run cv » fails here.
      - name: Generate the CV PDFs from the build
        run: |
          node scripts/cv-pdf.mjs dist --out "$RUNNER_TEMP/CV.pdf"
          node scripts/cv-pdf.mjs dist --lang en --out "$RUNNER_TEMP/CV-en.pdf"
        env:
          CHROME_BIN: google-chrome

      - name: Check the CV PDFs for applicant tracking systems
        run: |
          npm run check:cv
          node scripts/check-cv-ats.mjs "$RUNNER_TEMP/CV.pdf" --compare src/uploads/CV.pdf
          node scripts/check-cv-ats.mjs "$RUNNER_TEMP/CV-en.pdf" --lang en --compare src/uploads/CV-en.pdf

  # Every page of the build is valid HTML (html-validate, .htmlvalidate.json)
  html:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Validate HTML
        run: npm run validate

  # Every page of the sitemap meets WCAG 2 AA for axe and HTML_CodeSniffer
  # (pa11y-ci, .pa11yci.json)
  accessibility:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Check accessibility
        run: npm run check:a11y
        env:
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
