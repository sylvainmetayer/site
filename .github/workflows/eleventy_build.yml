name: Eleventy Build

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Retrieve npm cache (if any)
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-packages

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install packages
        run: npm ci

      # Production mode excludes drafts, like the Pages build of main.
      - name: Build site
        run: npm run production
        env:
          ELEVENTY_ENV: production

      - name: Check links, redirects and published URLs
        run: npm run check:links

      # The committed CV must read well in applicant tracking systems and match the
      # sources: a content change without « mise run cv » fails here.
      - name: Generate the CV PDF from the build
        run: node scripts/cv-pdf.mjs dist --out "$RUNNER_TEMP/CV.pdf"
        env:
          CHROME_BIN: google-chrome

      - name: Check the CV PDF for applicant tracking systems
        run: |
          npm run check:cv
          node scripts/check-cv-ats.mjs "$RUNNER_TEMP/CV.pdf" --compare src/uploads/CV.pdf
