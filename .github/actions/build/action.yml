name: Build
description: Installe les dépendances et construit le site de production dans dist/

runs:
  using: composite
  steps:
    - name: Use Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .nvmrc
        cache: npm

    # No dependency needs its install scripts (sharp ships prebuilt binaries)
    - name: Install packages
      shell: bash
      run: npm ci --ignore-scripts

    # Production mode excludes drafts, like the Pages build of main.
    - name: Build site
      shell: bash
      run: npm run production
      env:
        ELEVENTY_ENV: production
