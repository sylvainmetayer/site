name: Setup
description: Installe Node.js (version de .nvmrc) et les dépendances npm

runs:
  using: composite
  steps:
    - name: Use Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: npm

    # No dependency needs its install scripts (sharp ships prebuilt binaries,
    # Puppeteer downloads no browser: .puppeteerrc.cjs)
    - name: Install packages
      shell: bash
      run: npm ci --ignore-scripts
