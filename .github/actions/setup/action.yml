name: Setup
description: Installe Node.js (version de .nvmrc) et les dépendances npm

runs:
  using: composite
  steps:
    - name: Use Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .nvmrc
        cache: npm

    # No dependency needs its install scripts (sharp ships prebuilt binaries,
    # Puppeteer downloads no browser: .puppeteerrc.cjs)
    - name: Install packages
      shell: bash
      run: npm ci --ignore-scripts
