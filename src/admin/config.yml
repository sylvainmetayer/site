# Sveltia CMS — https://github.com/sveltia/sveltia-cms
# Connexion : "Sign In Using Access Token" avec un fine-grained PAT GitHub
# limité à ce dépôt (Contents et Pull requests : Read and write), comme ref.sylvain.dev.
backend:
  name: github
  repo: sylvainmetayer/site
  branch: main

publish_mode: editorial_workflow
site_url: https://www.sylvain.dev
display_url: https://www.sylvain.dev
logo_url: /images/icons/android-chrome-192x192.png
media_folder: src/images
public_folder: /images

collections:
  - name: posts
    label: Articles
    label_singular: Article
    folder: src/posts
    create: true
    slug: "{{slug}}"
    preview_path: "article/{{slug}}/"
    sortable_fields: [date, title]
    summary: "{{date | date('YYYY-MM-DD')}} · {{title}}"
    fields:
      - { label: Titre, name: title, widget: string }
      - { label: Date de publication, name: date, widget: datetime, time_format: false, format: "YYYY-MM-DD" }
      - { label: Extrait, name: excerpt, widget: text, required: false, hint: "Affiché dans les listes d'articles et utilisé comme description par défaut." }
      - { label: Tags, name: tags, widget: list, required: false }
      - { label: Contenu, name: body, widget: markdown }
      - { label: Brouillon, name: draft, widget: boolean, default: false, required: false }
      - { label: Mis en avant, name: star, widget: boolean, default: false, required: false }
      - { label: Masquer le sommaire, name: noToc, widget: boolean, default: false, required: false }
      - { label: Republier sur dev.to, name: repost, widget: select, options: ["dev.to"], required: false, hint: "Ajoute l'article au flux /devto.rss.xml importé par dev.to." }
      - { label: URL canonique, name: canonical, widget: string, required: false, hint: "Article republié depuis une autre plateforme (dev.to, Medium…) : URL de l'original. L'article sort du sitemap." }
      - { label: Publié à l'origine par, name: originalPublisher, widget: string, required: false, hint: "Ex. onepoint" }
      - { label: Co-auteurs (pseudos sur la plateforme d'origine), name: coauthors, widget: list, required: false }
      - { label: SEO - titre, name: metaTitle, widget: string, required: false, hint: "Titre complet de l’onglet (suffixe « · Sylvain » compris), 70 caractères au plus : la CI le vérifie (npm run validate)." }
      - { label: SEO - description, name: metaDesc, widget: string, required: false }
      - { label: Image de partage, name: socialImage, widget: image, required: false }

  - name: projets
    label: Projets
    label_singular: Projet
    folder: src/projets
    create: true
    slug: "{{slug}}"
    summary: "{{year}} · {{title}}"
    sortable_fields: [year, title]
    fields:
      - { label: Nom, name: title, widget: string, hint: "Nom court, affiché en police mono (ex. email-alias-manager)." }
      - { label: Année, name: year, widget: number, value_type: int }
      - { label: Technologies, name: stack, widget: list, required: false }
      - { label: Dépôt, name: repo, widget: string, required: false }
      - { label: Article associé, name: article, widget: string, required: false, hint: "Chemin de l'article, ex. /article/ansible/" }
      - { label: Afficher sur l'accueil, name: featured, widget: boolean, default: false, required: false }
      - { label: Description, name: body, widget: markdown }

  - name: work
    label: Expériences
    label_singular: Expérience
    folder: src/work
    create: true
    slug: "{{slug}}"
    summary: "{{start | date('YYYY-MM')}} · {{title}}"
    fields:
      - { label: Titre, name: title, widget: string }
      - { label: Lieu, name: location, widget: string }
      - { label: Lien, name: link, widget: string, required: false }
      - { label: Début, name: start, widget: datetime, time_format: false, format: "YYYY-MM-DD" }
      - { label: Fin, name: end, widget: datetime, time_format: false, format: "YYYY-MM-DD", required: false }
      - { label: Contenu, name: body, widget: markdown }

  - name: pages
    label: Pages
    files:
      - name: home
        label: Accueil
        file: src/index.md
        fields:
          - { label: Layout, name: layout, widget: hidden, default: layouts/home.njk }
          - { label: Titre (nom affiché), name: title, widget: string }
          - { label: Présentation, name: body, widget: markdown }
          - { label: Titre « derniers articles », name: postsHeading, widget: string }
          - { label: Titre « articles mis en avant », name: starHeading, widget: string }
          - { label: Titre « projets », name: projectsHeading, widget: string }
          - { label: Lien vers tous les articles, name: archiveButtonText, widget: string }
          - { label: SEO - titre, name: metaTitle, widget: string, required: false, hint: "Titre complet de l’onglet (suffixe « · Sylvain » compris), 70 caractères au plus : la CI le vérifie (npm run validate)." }
          - { label: SEO - description, name: metaDesc, widget: string, required: false }
          - { label: Image de partage, name: socialImage, widget: image, required: false }

  - name: generic_pages
    label: Pages génériques
    folder: src/pages
    create: true
    slug: "{{slug}}"
    fields:
      - { label: Titre, name: title, widget: string }
      - { label: Permalien (ex. /ma-page/index.html), name: permalink, widget: string, required: false }
      - { label: SEO - titre, name: metaTitle, widget: string, required: false, hint: "Titre complet de l’onglet (suffixe « · Sylvain » compris), 70 caractères au plus : la CI le vérifie (npm run validate)." }
      - { label: SEO - description, name: metaDesc, widget: string, required: false }
      - { label: Contenu, name: body, widget: markdown }

  - name: data
    label: Données
    files:
      - name: site
        label: Site
        file: src/_data/site.json
        fields:
          - { label: Nom du site, name: name, widget: string }
          - { label: URL, name: url, widget: string }
          - { label: Nom de l'auteur, name: authorName, widget: string }
          - { label: Rôle, name: role, widget: string }
          - { label: Ville, name: location, widget: string }
          - { label: Email, name: authorEmail, widget: string }
          - { label: Compte Twitter, name: authorHandle, widget: string, required: false }
          - { label: Description courte, name: shortDesc, widget: string }
          - { label: Articles sur l'accueil, name: maxPostsPerPage, widget: number, value_type: int, default: 5 }
          - { label: Favicon, name: faviconPath, widget: string }
          - { label: Langue, name: locale, widget: string, default: fr }
          - { label: Bandeau « version de développement », name: displayDevWarning, widget: boolean, default: false }
          - { label: Bandeau « site en travaux », name: displayWipWarning, widget: boolean, default: false }
      - name: navigation
        label: Navigation
        file: src/_data/navigation.json
        fields:
          - label: Liens
            name: items
            widget: list
            fields:
              - { label: Texte, name: text, widget: string }
              - { label: URL, name: url, widget: string }
      - name: social
        label: Réseaux
        file: src/_data/social.json
        fields:
          - label: Liens
            name: links
            widget: list
            summary: "{{label}}"
            fields:
              - { label: Libellé, name: label, widget: string }
              - { label: URL, name: url, widget: string }
      - name: formations
        label: Formations
        file: src/_data/formations.json
        fields:
          - label: Formations
            name: formations
            widget: list
            summary: "{{end}} · {{title}}"
            fields:
              - { label: Titre, name: title, widget: string }
              - { label: Établissement, name: location, widget: string }
              - { label: Lien, name: link, widget: string, required: false }
              - { label: Année de début, name: start, widget: number, value_type: int, required: false }
              - { label: Année de fin, name: end, widget: number, value_type: int }
              - { label: Description, name: description, widget: text, required: false }
              - { label: Tag des articles liés, name: tag, widget: string, required: false }
      - name: certifications
        label: Certifications
        file: src/_data/certifications.json
        fields:
          - label: Certifications
            name: certifications
            widget: list
            summary: "{{date | date('YYYY')}} · {{title}}"
            fields:
              - { label: Titre, name: title, widget: string }
              - { label: Lien, name: link, widget: string, required: false }
              - { label: Date, name: date, widget: datetime, time_format: false, format: "YYYY-MM-DD" }
              - { label: Description, name: description, widget: text, required: false }
      - name: skills
        label: Compétences
        file: src/_data/skills.json
        fields:
          - { label: Compétences, name: skills, widget: list }
