# Analyse SonarCloud lancée par .github/workflows/sonarcloud.yml
sonar.organization=sylvainmetayer
sonar.projectKey=sylvainmetayer_site
sonar.projectName=sylvain.dev

sonar.sources=.
# Contenu (Markdown, images, PDF) et fichiers générés ou tiers : seul le code est analysé
sonar.exclusions=dist/**,node_modules/**,.cache/**,src/images/**,src/uploads/**,src/posts/**,src/projets/**,src/work/**,src/pages/**,**/*.md
sonar.sourceEncoding=UTF-8

# Pas de tests automatisés, donc pas de couverture : la Quality Gate ne doit pas l'exiger
sonar.coverage.exclusions=**/*
